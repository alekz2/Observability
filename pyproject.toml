[project]
name = "remote-query-service"
version = "0.1.0"
description = "Read-only remote query API service for approved logs and user-configurable host queries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.15.0,<3.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "orjson>=3.10.0,<4.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "redis>=5.2.0,<6.0.0",
    "structlog>=24.4.0,<25.0.0",
    "uvicorn>=0.32.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

